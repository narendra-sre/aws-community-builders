name: Terraform checks

on:
  pull_request:
    paths:
      - "terraform/**"
      - "modules/**"
      - ".github/workflows/terraform-checks.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "modules/**"
      - ".github/workflows/terraform-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format
        run: terraform -chdir=article-06-terraform-infrastructure-deployment/terraform fmt -check -recursive
      - name: Terraform initialize (no backend)
        run: terraform -chdir=article-06-terraform-infrastructure-deployment/terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=article-06-terraform-infrastructure-deployment/terraform validate
